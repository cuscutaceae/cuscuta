[workspace]
members = [
  "cuscuta-chilo",
  "cuscuta-common",
  "cuscuta-entry",
  "cuscuta-mock",
  "cuscuta-test",
  "cuscuta-worker",
  "cuscutactl",
]
resolver = "2"

[workspace.package]
version = "0.1.18"

[workspace.dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
comfy-table = "7.2"
envy = "0.4.2"
futures = "0.3.34"
hex = "0.4.3"
rand = "0.10.3"
redis = { version = "1.7.1", features = ["streams"] }
reqwest = { version = "0.13.5", features = ["json", "query", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", features = ["postgres", "chrono", "runtime-tokio"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = "deny"
nursery = "deny"
