[package]
name = "cuscuta-worker"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.8"
chrono = { version = "0.4.44", features = ["serde"] }
env_logger = "0.11.10"
log = "0.4.29"
rand = "0.10.1"
redis = { version = "1.2.0", features = ["streams"] }
reqwest = { version = "0.13.2", features = ["json", "query", "form"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["postgres", "chrono", "runtime-tokio"] }
thiserror = "2.0.18"
tokio = { version = "1.51.1", features = ["rt-multi-thread", "signal"] }
tokio-util = "0.7.18"
cuscuta-common = { path = "../cuscuta-common" }
