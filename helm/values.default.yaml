# Minimal production configuration.
# Fill in the blanks, then:
#   helm install cuscuta . -f values.default.yaml

# -- Required: PostgreSQL connection
postgresql:
  url: "postgresql://user:password@host:5432/db"
  # To use an external Secret instead, uncomment below and remove url above:
  # secret:
  #   enabled: true
  #   name: "my-postgres-secret"
  #   key: "ACCOUNTS_SQL_ADDR"

# -- Required: Redis connection
redis:
  url: "redis://host:6379/0"
  # To use an external Secret instead, uncomment below and remove url above:
  # secret:
  #   enabled: true
  #   name: "my-redis-secret"
  #   key: "REDIS_ADDR"

# -- Required: challenge constants (contact admin for values)
chilo:
  constants:
    binC1: ""
    binC2: ""
    binLoginC31: ""
    binLoginC32: ""

# -- Required: GitHub tokens and repo info
github:
  bundleRepository: cuscutaceae/scales
  bundlePath: bundle.json
  bundleToken: ""
  songRepository: cuscutaceae/scales
  songPath: songs/songlist
  songToken: ""

# -- Required: target API endpoints
api:
  login: ""
  listFriends: ""
  addFriends: ""
  deleteFriends: ""
  getRank: ""