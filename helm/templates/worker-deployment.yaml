apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cuscuta.fullname" . }}-worker
  labels:
    {{- include "cuscuta.componentLabels" (dict "root" . "component" "worker") | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "cuscuta.componentLabels" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cuscuta.componentLabels" (dict "root" . "component" "worker") | nindent 8 }}
    spec:
      containers:
        - name: worker
          image: {{ include "cuscuta.image" (dict "root" . "component" "cuscuta-worker") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.worker.port }}
              protocol: TCP
          env:
            - name: RUST_LOG
              value: {{ .Values.rustLog | quote }}
            - name: ACCOUNTS_SQL_ADDR
              valueFrom:
                secretKeyRef:
                  name: {{ include "cuscuta.secretName" (dict "root" . "cfg" .Values.postgresql.secret) }}
                  key: {{ include "cuscuta.secretKey" (dict "cfg" .Values.postgresql.secret "defaultKey" "ACCOUNTS_SQL_ADDR") }}
            - name: REDIS_ADDR
              valueFrom:
                secretKeyRef:
                  name: {{ include "cuscuta.secretName" (dict "root" . "cfg" .Values.redis.secret) }}
                  key: {{ include "cuscuta.secretKey" (dict "cfg" .Values.redis.secret "defaultKey" "REDIS_ADDR") }}
            - name: RESOURCES_APP_VERSION_URL
              value: {{ .Values.dataSource.base.appVersion.url | quote }}
            - name: RESOURCES_APP_VERSION_USE_ONLINE
              value: {{ .Values.dataSource.base.appVersion.useOnlineVersion | quote }}
            - name: RESOURCES_APP_VERSION_DEFAULT
              value: {{ .Values.dataSource.base.appVersion.versionDefault | quote }}
            - name: RESOURCES_SONG_URL
              value: {{ .Values.dataSource.base.songUrl | quote }}
            - name: USE_ONLINE_PREFIX
              value: {{ .Values.api.prefix.useOnlinePrefix | quote }}
            - name: SCIRPOPHAGA_URL
              value: {{ .Values.dataSource.scirpophaga.url | quote }}
            - name: API_PREFIX_AUTH
              value: {{ .Values.api.prefix.auth | quote }}
            - name: API_PREFIX_COMMON
              value: {{ .Values.api.prefix.common | quote }}
            - name: API_CHILO
              value: {{ include "cuscuta.chiloUrl" . | quote }}
            - name: API_ENDPOINT_LOGIN
              value: {{ .Values.api.path.login | quote }}
            - name: API_ENDPOINT_LIST_FRIENDS
              value: {{ .Values.api.path.listFriends | quote }}
            - name: API_ENDPOINT_ADD_FRIENDS
              value: {{ .Values.api.path.addFriends | quote }}
            - name: API_ENDPOINT_DELETE_FRIENDS
              value: {{ .Values.api.path.deleteFriends | quote }}
            - name: API_ENDPOINT_GET_RANK
              value: {{ .Values.api.path.getRank | quote }}
            - name: API_ENDPOINT_NOTIFICATION
              value: {{ .Values.api.path.notification | quote }}
            - name: API_ENDPOINT_COMPOSE_AGGREGATE
              value: {{ .Values.api.path.compose | quote }}
            - name: WORKER_MAX_JOBS
              value: {{ .Values.worker.maxJobs | quote }}
            - name: WORKER_MAX_RETRIES
              value: {{ .Values.worker.maxRetries | quote }}
            - name: WORKER_EXPONENTIAL_BACKOFF_BASE_MILLIS
              value: {{ .Values.worker.exponentialBackoffBaseMillis | quote }}
            - name: WORKER_EXPONENTIAL_BACKOFF_MULTIPLIER
              value: {{ .Values.worker.exponentialBackoffMultiplier | quote }}
            - name: WORKER_EXPONENTIAL_BACKOFF_MAX_DELAY_MILLIS
              value: {{ .Values.worker.exponentialBackoffMaxDelayMillis | quote }}
            - name: WORKER_ACCOUNT_LEASE_TIME_SECS
              value: {{ .Values.worker.accountLeaseTimeSecs | quote }}
            - name: WORKER_ACCOUNT_LEASE_TIME_REFRESH_GAP_SECS
              value: {{ .Values.worker.accountLeaseTimeRefreshGapSecs | quote }}  
            - name: WORKER_JOB_MAX_WORK_TIME_SECS
              value: {{ .Values.worker.jobMaxWorkTimeSecs | quote }}
            - name: WORKER_EMPTY_FRIENDS_DELAY_TIME_SECS
              value: {{ .Values.worker.emptyFriendsDelayTimeSecs | quote }}
            - name: REDIS_STREAM_REFRESH_TTL
              value: {{ .Values.redisStreamRefreshTtl | quote }}
            - name: ETA_ENABLE
              value: {{ .Values.eta.enabled | quote }}
            - name: ETA_SEARCH_LIMIT
              value: {{ .Values.eta.searchLimit | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.worker.port }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.worker.port }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
