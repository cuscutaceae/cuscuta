apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cuscuta.fullname" . }}-secret
  labels:
    {{- include "cuscuta.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Database connections (read by cuscutactl in k8s mode)
  ACCOUNTS_SQL_ADDR: {{ required "postgresql.url is required" .Values.postgresql.url | quote }}
  REDIS_ADDR: {{ required "redis.url is required" .Values.redis.url | quote }}
  # GitHub access tokens
  GITHUB_BUNDLE_TOKEN: {{ .Values.github.bundleToken | quote }}
  GITHUB_SONG_TOKEN: {{ .Values.github.songToken | quote }}
  # Chilo challenge constants
  BIN_C1: {{ .Values.chilo.constants.binC1 | quote }}
  BIN_C2: {{ .Values.chilo.constants.binC2 | quote }}
  BIN_LOGIN_C31: {{ .Values.chilo.constants.binLoginC31 | quote }}
  BIN_LOGIN_C32: {{ .Values.chilo.constants.binLoginC32 | quote }}