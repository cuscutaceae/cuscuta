{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cuscuta.fullname" . }}-migrate
  labels:
    {{- include "cuscuta.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "-5"
spec:
  template:
    metadata:
      labels:
        {{- include "cuscuta.componentLabels" (dict "root" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ printf "%s:%s" .Values.migration.image .Values.migration.tag }}
          command: ["/bin/sh", "-c"]
          args:
            - "migrate -path=/migrations -database=$DATABASE_URL?sslmode=disable up"
          env:
            - name: DATABASE_URL
            {{- if .Values.postgresql.secret.enabled }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.secret.name }}
                  key: {{ include "cuscuta.secretKey" (dict "cfg" .Values.postgresql.secret "defaultKey" "ACCOUNTS_SQL_ADDR") }}
            {{- else }}
              value: {{ required "postgresql.url is required when postgresql.secret.enabled is false" .Values.postgresql.url | quote }}
            {{- end }}
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        - name: migrations
          configMap:
            name: {{ include "cuscuta.fullname" . }}-migrations
{{- end }}
