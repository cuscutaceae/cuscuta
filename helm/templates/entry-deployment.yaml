apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cuscuta.fullname" . }}-entry
  labels:
    {{- include "cuscuta.componentLabels" (dict "root" . "component" "entry") | nindent 4 }}
spec:
  replicas: {{ .Values.entry.replicas }}
  selector:
    matchLabels:
      {{- include "cuscuta.componentLabels" (dict "root" . "component" "entry") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cuscuta.componentLabels" (dict "root" . "component" "entry") | nindent 8 }}
    spec:
      containers:
        - name: entry
          image: {{ include "cuscuta.image" (dict "root" . "component" "cuscuta-entry") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.entry.port }}
              protocol: TCP
          env:
            - name: RUST_LOG
              value: {{ .Values.rustLog | quote }}
            - name: REDIS_STREAM_REFRESH_TTL
              value: {{ .Values.redisStreamRefreshTtl | quote }}
            - name: ETA_ENABLE
              value: {{ .Values.eta.enabled | quote }}
            - name: ETA_RECORD_TRIM
              value: {{ .Values.eta.recordTrim | quote }}
            - name: ETA_SEARCH_LIMIT
              value: {{ .Values.eta.searchLimit | quote }}
            - name: STAT_ENABLE
              value: {{ .Values.entry.status.enabled | quote }}
            - name: ACCOUNTS_SQL_ADDR
              valueFrom:
                secretKeyRef:
                  name: {{ include "cuscuta.secretName" (dict "root" . "cfg" .Values.postgresql.secret) }}
                  key: {{ include "cuscuta.secretKey" (dict "cfg" .Values.postgresql.secret "defaultKey" "ACCOUNTS_SQL_ADDR") }}
            - name: REDIS_ADDR
              valueFrom:
                secretKeyRef:
                  name: {{ include "cuscuta.secretName" (dict "root" . "cfg" .Values.redis.secret) }}
                  key: {{ include "cuscuta.secretKey" (dict "cfg" .Values.redis.secret "defaultKey" "REDIS_ADDR") }}
            - name: RESOURCES_SONG_URL
              value: {{ .Values.dataSource.base.songUrl | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.entry.port }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.entry.port }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
