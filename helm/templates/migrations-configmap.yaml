{{- if .Values.migration.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cuscuta.fullname" . }}-migrations
  labels:
    {{- include "cuscuta.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-6"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  {{- (.Files.Glob "files/migrations/*.sql").AsConfig | nindent 2 }}
{{- end }}