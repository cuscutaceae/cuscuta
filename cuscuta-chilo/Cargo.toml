[package]
name = "cuscuta-chilo"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
env_logger = "0.11.10"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "signal"] }
tokio-util = "0.7.18"
chilo = { git = "https://github.com/cuscutaceae/chilo", tag = "0.1.0" }
base64 = "0.22.1"
unicorn-engine = "2.1.1"
hex = "0.4.3"
